upstream worklog_app {
  server app:3000;
  keepalive 16;
}

# SEC-01：默认只对外提供 HTTPS，80 端口仅用于跳转与健康检查。
# 证书位置：infra/nginx/certs/fullchain.pem 与 privkey.pem。
# 本地联调可用 infra/scripts/generate-self-signed-cert.sh 生成自签证书，生产请替换为正式证书。
server {
  listen 80;
  server_name _;

  location = /health {
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 308 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  # PERF-01：与应用 32MB bodyLimit 对齐，不再放行 70MB 级请求体。
  client_max_body_size 40m;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  # SEC-11：网关层安全响应头（应用层同样设置，双保险）。
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;

  location = /health {
    proxy_pass http://worklog_app/api/health;
  }

  location / {
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_pass http://worklog_app;
  }
}
